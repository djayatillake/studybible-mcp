name: Link check

# Fetches every research-source URL and search template (~100 requests to
# third-party sites), so it runs only when started by hand, not on every push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - name: Check research-source links
        # Without the production database this checks the catalogue only; the
        # theology_content URLs need a local run with --db.
        run: uv run python scripts/check_links.py
